// Controller <-> agent gRPC contract (SPEC-1 FR-19, Appendix B.4).
//
// The controller owns desired state and pushes Assignments to agents; agents own
// a host, actuate microVMs via the M1 VMM stack, and report observed state back.
syntax = "proto3";
package micromachines.v1alpha1;

// MachineService: the controller assigns/queries machines on an agent's host.
service MachineService {
  rpc Assign(Assignment) returns (MachineStatus);
  rpc Delete(MachineRef) returns (Ack);
  rpc Get(MachineRef) returns (Machine);
  rpc WatchAssignments(HostRef) returns (stream Assignment); // controller -> agent

  // Cluster exec (controller -> agent -> guest, SPEC-1 FR-13). The agent is
  // client-only (it dials in and has no inbound address), so exec uses the same
  // reverse-channel shape as assignments: the agent opens WatchExec and the
  // controller pushes an ExecTask down it; the agent runs the command against the
  // local guest's vsock bridge and streams the output back up via ReportExecResult.
  // A request_id correlates the pushed task with its streamed result, so the
  // controller can route output back to the waiting REST caller. The single-host
  // path (`mm exec`) still reaches the guest directly via the host vsock bridge UDS
  // and needs no control-plane rpc.
  rpc WatchExec(HostRef) returns (stream ExecTask);        // controller -> agent
  rpc ReportExecResult(stream ExecChunk) returns (Ack);    // agent -> controller

  // Cluster snapshot (controller -> agent -> worker, SPEC-1 FR-14/FR-18), same
  // reverse-channel shape as exec: the agent opens WatchSnapshots and the controller
  // pushes a SnapshotTask; the agent drives its local worker's control channel
  // (SNAPSHOT/BRANCH) and reports the worker-allocated id back via ReportSnapshotResult.
  // request_id correlates the task with its result for the waiting REST caller.
  rpc WatchSnapshots(HostRef) returns (stream SnapshotTask); // controller -> agent
  rpc ReportSnapshotResult(SnapshotResult) returns (Ack);    // agent -> controller
}

// A snapshot the controller pushes to a host's agent. `branch` = live branch (FR-16)
// rather than a paused snapshot. The worker allocates the id (the agent has no path to
// supply one), so no directory is carried.
message SnapshotTask { string request_id = 1; MachineRef ref = 2; bool branch = 3; }
// The streamed-back result: the worker-allocated snapshot `id` on success, else
// `error`. `request_id` echoes the originating SnapshotTask. (The snapshot's memory
// size is the source machine's RAM, which the controller already knows.)
message SnapshotResult {
  string request_id = 1; string id = 2; bool ok = 3; string error = 4;
}

// An exec command the controller pushes to a host's agent, tagged with a request_id
// the agent echoes on every ExecChunk so the controller can correlate the streamed
// result with the REST caller that is blocked awaiting it.
message ExecTask { string request_id = 1; ExecRequest request = 2; }

// Exec wire contract. `cmd` is argv (cmd[0] is the program); `timeout_ms` bounds the
// command's run time in the guest.
message ExecRequest { MachineRef ref = 1; repeated string cmd = 2; uint64 timeout_ms = 3; }
// A streamed exec result: an output chunk (stdout/stderr), or — when `done` — the
// terminal frame carrying `exit_code`. `request_id` echoes the originating ExecTask
// so the controller routes the chunk to the right waiting caller. `error`, when
// non-empty on the terminal frame, marks a transport/exec failure (couldn't reach
// the guest) as distinct from a command that simply exited non-zero.
message ExecChunk {
  string stream = 1; bytes data = 2; int32 exit_code = 3; bool done = 4;
  string request_id = 5; string error = 6;
}

// HostService: the agent reports capacity/health and machine state transitions.
service HostService {
  rpc ReportCapacity(Capacity) returns (Ack);
  rpc Heartbeat(HostRef) returns (Ack);
  // The agent reports a machine's observed state transition (agent -> controller),
  // which the controller records as the machine's status. This is how observed
  // state flows back from the data plane.
  rpc ReportEvent(MachineEvent) returns (Ack);
  rpc StreamEvents(HostRef) returns (stream MachineEvent);
}

message MachineRef { string uid = 1; string namespace = 2; }
message HostRef { string host_id = 1; }
message Ack { bool ok = 1; string message = 2; }

message MachineSpec {
  string image = 1; string kernel = 2; uint32 vcpus = 3; uint64 memory_mib = 4;
  bool ssh = 5; Workload workload = 6; Networking net = 7; bool running = 8;
}
message Workload { string entrypoint = 1; repeated string args = 2; map<string,string> env = 3; }
message Networking { string mode = 1; } // "auto"

enum State { CREATED=0; PREPARING=1; STARTING=2; RUNNING=3; PAUSED=4;
  STOPPING=5; STOPPED=6; FAILED=7; DESTROYING=8; DESTROYED=9; }

message MachineStatus { State state = 1; string ip = 2; string health = 3;
  string host_id = 4; uint32 retry_count = 5; }
message Machine { MachineRef ref = 1; MachineSpec spec = 2; MachineStatus status = 3; }
message Assignment { Machine machine = 1; }
message Capacity { string host_id = 1; uint32 vcpus_total = 2; uint32 vcpus_free = 3;
  uint64 mem_mib_total = 4; uint64 mem_mib_free = 5; }
message MachineEvent { string uid = 1; State state = 2; string message = 3; string ip = 4; }
