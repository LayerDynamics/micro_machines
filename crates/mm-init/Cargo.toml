[package]
name = "mm-init"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mm-init"
path = "src/main.rs"

[dependencies]
# Intentionally tiny. No async runtime. The exec agent (Sandbox Mode) speaks the
# shared vsock exec protocol from mm-sandbox (serde frames) — the one place the
# guest needs serde.
mm-sandbox = { path = "../mm-sandbox" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
libc = { workspace = true }
