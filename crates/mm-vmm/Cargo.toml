[package]
name = "mm-vmm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-api-types = { path = "../mm-api-types" }
serde = { workspace = true }
serde_json = { workspace = true } # snapshot manifest (de)serialization
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = { workspace = true }
kvm-bindings = { workspace = true }
bincode = { workspace = true } # binary (de)serialization of the snapshot state file
vm-memory = { workspace = true }
vmm-sys-util = { workspace = true }
linux-loader = { workspace = true }
vm-superio = { workspace = true }
vm-allocator = { workspace = true }
event-manager = { workspace = true }
virtio-queue = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
# The FR-16 running-BRANCH write-protect engine. Optional + feature-gated (`branch`) so
# the lib still cross-checks on the non-Linux dev host — userfaultfd-sys needs Linux
# kernel headers it can't find when cross-compiling from macOS.
userfaultfd = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Enables virtio-queue's MockSplitQueue so device unit tests can build descriptor
# chains in guest memory without a real guest (runs in CI's Linux test job).
virtio-queue = { workspace = true, features = ["test-utils"] }
# The fork integration test reads/writes guest RAM directly to prove CoW isolation.
vm-memory = { workspace = true }
# The fork exec-independence test execs into each forked child over its vsock bridge.
mm-sandbox = { path = "../mm-sandbox" }
# FR-16 Phase 0 probe registers the live guest's RAM with UFFD write-protect to test
# whether KVM-guest writes deliver WP faults on this kernel (gates the BRANCH engine).
userfaultfd = { workspace = true }

[features]
# KVM-dependent integration tests, run only on linux+kvm hosts. Pulls in `branch` so
# the running-BRANCH engine and its KVM e2e build under the integration test job.
kvm-integration = ["branch"]
# FR-16 running-BRANCH engine (userfaultfd write-protect). Optional so a plain
# `cargo check`/`clippy` of the lib on a non-Linux host doesn't try to build
# userfaultfd-sys (which needs Linux kernel headers).
branch = ["dep:userfaultfd"]
