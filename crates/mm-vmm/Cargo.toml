[package]
name = "mm-vmm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mm-api-types = { path = "../mm-api-types" }
serde = { workspace = true }
serde_json = { workspace = true } # snapshot manifest (de)serialization
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = { workspace = true }
kvm-bindings = { workspace = true }
vm-memory = { workspace = true }
vmm-sys-util = { workspace = true }
linux-loader = { workspace = true }
vm-superio = { workspace = true }
vm-allocator = { workspace = true }
event-manager = { workspace = true }
virtio-queue = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Enables virtio-queue's MockSplitQueue so device unit tests can build descriptor
# chains in guest memory without a real guest (runs in CI's Linux test job).
virtio-queue = { workspace = true, features = ["test-utils"] }

[features]
# KVM-dependent integration tests, run only on linux+kvm hosts.
kvm-integration = []
