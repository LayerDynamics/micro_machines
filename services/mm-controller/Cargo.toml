[package]
name = "mm-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MicroMachines control plane: REST API + scheduler + reconciler + Postgres store (M2)"

[[bin]]
name = "mm-controller"
path = "src/main.rs"

[dependencies]
mm-api-types = { path = "../../crates/mm-api-types" }

tokio = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
jsonwebtoken = { workspace = true }

[dev-dependencies]
# Integration tests drive the router in-process (tower oneshot) and mint their own
# HS256 tokens; they run against a real Postgres in CI (no network server needed).
http-body-util = "0.1"
