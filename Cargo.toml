[workspace]
resolver = "2"
members = [
    "crates/mm-api-types",
    "crates/mm-vmm",
    "crates/mm-net",
    "crates/mm-init",
    "crates/mm-sandbox",
    "crates/mm-image",
    "apps/mm",
    "crates/mm-host",
    "crates/mm-proto",
    "services/mm-controller",
    "services/mm-agent",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/layerdynamics/micro_machines"
authors = ["The MicroMachines Authors"]
rust-version = "1.74"

[workspace.dependencies]
# Shared third-party deps are declared here once; member crates reference them
# with `serde = { workspace = true }`. Versions are managed in this single place.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# --- M1 walking-skeleton deps ---
# rust-vmm crate ecosystem (the native VMM core). The KVM/memory/loader crates
# are a tightly-coupled set; versions come from a known-good matrix (Firecracker's
# published pins) so resolution does not deadlock. These are referenced only from
# `[target.'cfg(target_os = "linux")'.dependencies]` tables, so non-Linux hosts
# never compile them.
kvm-ioctls = "0.24"
kvm-bindings = { version = "0.14", features = ["fam-wrappers", "serde"] }
# Pinned to 0.16 so the *single* vm-memory in the graph is shared by linux-loader
# (requires >=0.16,<=0.17.1) and virtio-queue 0.16 (requires ^0.16). A higher pin
# splits GuestMemory into incompatible trait copies across crate boundaries.
vm-memory = { version = "0.16", features = ["backend-mmap", "backend-bitmap"] }
vmm-sys-util = "0.15"
linux-loader = "0.13"
vm-superio = "0.8"
vm-allocator = { version = "0.1", features = ["serde"] }
event-manager = "0.4"
virtio-queue = "0.16"
seccompiler = "0.5"

# Host-side syscalls / namespaces / mounts (linux-only consumers).
nix = { version = "0.30", features = ["mount", "sched", "user", "net", "fs", "reboot", "ioctl", "process"] }

# CLI + observability + ergonomics (cross-platform).
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libc = "0.2"
redb = "2"

# --- M2 control-plane deps ---
# The control plane (REST + scheduler + reconciler + Postgres) and the host agent
# (gRPC client + actuation bridge). These are cross-platform; the agent's actuation
# path reuses the linux-only M1 crates behind cfg gates. Versions are a known-good
# matrix: tonic 0.12 pairs with prost 0.13 and tokio-rustls 0.26 (rustls 0.23);
# sqlx 0.8 and axum 0.7 share that hyper-1 / rustls-0.23 stack.
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
axum = "0.7"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
] }
rustls = "0.23"
rustls-pemfile = "2"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["trace"] }
jsonwebtoken = "9"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[profile.release]
lto = "thin"
codegen-units = 1
