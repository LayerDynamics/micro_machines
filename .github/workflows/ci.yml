name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # KVM capability preflight: reports whether this runner can host microVMs.
  # GitHub-hosted runners do not expose nested KVM, so the job records capability
  # without failing the build; a self-hosted/KVM-enabled runner exercises the
  # real host-virtualization path. M1 extends this job with mm-vmm integration
  # tests once that crate exists.
  kvm-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe KVM capability
        run: |
          set -euo pipefail
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=available (/dev/kvm is a readable, writable character device)"
            if grep -Eqm1 'vmx|svm' /proc/cpuinfo; then
              echo "cpu-virtualization=supported"
            else
              echo "cpu-virtualization=not-reported"
            fi
          else
            echo "kvm=unavailable (GitHub-hosted runners do not expose nested KVM)"
            echo "Host-virtualization integration runs on a self-hosted KVM runner."
          fi
