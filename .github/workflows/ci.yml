name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # KVM capability preflight: reports whether this runner can host microVMs.
  # GitHub-hosted runners do not expose nested KVM, so the job records capability
  # without failing the build; a self-hosted/KVM-enabled runner exercises the
  # real host-virtualization path. M1 extends this job with mm-vmm integration
  # tests once that crate exists.
  kvm-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe KVM capability
        run: |
          # Diagnostic only (never fails the build): distinguish "no /dev/kvm node"
          # from "node present but not accessible to the runner user", and report
          # whether a permissions fix makes it usable.
          set +e
          echo "device-exists=$([ -e /dev/kvm ] && echo yes || echo no)"
          ls -ld /dev/kvm 2>&1 || echo "(no /dev/kvm node)"
          echo "readable=$([ -r /dev/kvm ] && echo yes || echo no) writable=$([ -w /dev/kvm ] && echo yes || echo no)"
          echo "cpu-virt-flag-count=$(grep -Ec 'vmx|svm' /proc/cpuinfo)"
          echo "runner-user=$(id -un) groups=$(id -Gn)"
          getent group kvm || echo "(no kvm group)"
          # Standard hosted-runner fix used by Android-emulator workflows:
          sudo modprobe kvm 2>/dev/null
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules 2>/dev/null
            sudo udevadm trigger --name-match=kvm 2>/dev/null
            sudo chmod 0666 /dev/kvm 2>/dev/null
            echo "after-fix: readable=$([ -r /dev/kvm ] && echo yes || echo no) writable=$([ -w /dev/kvm ] && echo yes || echo no)"
          fi
          exit 0

  # Real boot-to-userspace integration test. Runs on a self-hosted runner that
  # exposes /dev/kvm; skipped automatically elsewhere because no such runner picks
  # the job up. Fetches a test kernel + minimal rootfs, then runs the #[ignore]d
  # mm-vmm KVM tests.
  kvm-integration:
    runs-on: [self-hosted, linux, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: Require /dev/kvm
        run: test -e /dev/kvm
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Run KVM boot integration test
        run: cargo test -p mm-vmm --features kvm-integration -- --ignored
