name: CI
on:
  push: { branches: [main] }
  pull_request: {}

# Cancel an in-flight run for the same ref when a new commit lands, so superseded
# (and any stuck) runs don't keep occupying runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # Control-plane tests against a real PostgreSQL. The mm-controller crate uses
  # sqlx's runtime query API (no compile-time DB needed), so unit tests build
  # anywhere; the DB-backed integration tests (api_pg, and reconcile_loop later)
  # run here against a postgres:16 service container. DATABASE_URL points the tests
  # at it; they apply the embedded migrations themselves.
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mm-controller --all-targets
      - run: cargo test -p mm-controller

  # Full cluster boot end-to-end (FR-17/18/19, NFR-R2): stand up a real controller
  # + a real host agent over mutual-TLS (Postgres-backed), then boot a microVM
  # through the cluster with `mm --server run` and prove it survives a controller
  # restart. This closes the loop the in-process reconcile test leaves open (which
  # uses a fake agent): here a real agent actually boots a VM on /dev/kvm via the
  # shared mm-host path. Needs KVM + Postgres + the kernel/mm-init/dropbear fixtures.
  cluster-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install OCI tooling + fixture build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs skopeo openssl curl file
          sudo curl -fsSL -o /usr/local/bin/umoci \
            https://github.com/opencontainers/umoci/releases/download/v0.4.7/umoci.amd64
          sudo chmod 0755 /usr/local/bin/umoci
      - name: Build static dropbear (injected sshd)
        run: ./scripts/build-dropbear.sh
      - name: Fetch test fixtures (kernel + musl mm-init)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Enable cgroup v2 cpu+memory controllers
        run: echo "+cpu +memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
      - name: Build the cluster binaries
        run: cargo build -p mm-controller -p mm-agent -p mm
      - name: Cluster boot end to end as root
        run: |
          sudo -E env "PATH=$PATH" \
            DATABASE_URL="$DATABASE_URL" \
            MM_KERNEL="$PWD/crates/mm-vmm/tests/fixtures/vmlinux" \
            MM_INIT="$PWD/target/x86_64-unknown-linux-musl/release/mm-init" \
            MM_SSHD="$PWD/crates/mm-vmm/tests/fixtures/dropbear" \
            bash scripts/cluster-e2e.sh

  # KVM capability preflight: reports whether this runner can host microVMs.
  # GitHub-hosted ubuntu-latest exposes /dev/kvm with nested virtualization; the
  # device is present but owned root:kvm (the runner user must be granted access).
  # This diagnostic records device existence, perms, CPU virt flags, and whether a
  # permissions fix makes it usable — without failing the build. The kvm-integration
  # job below applies that fix and runs the real boot test.
  kvm-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe KVM capability
        run: |
          # Diagnostic only (never fails the build): distinguish "no /dev/kvm node"
          # from "node present but not accessible to the runner user", and report
          # whether a permissions fix makes it usable.
          set +e
          echo "device-exists=$([ -e /dev/kvm ] && echo yes || echo no)"
          ls -ld /dev/kvm 2>&1 || echo "(no /dev/kvm node)"
          echo "readable=$([ -r /dev/kvm ] && echo yes || echo no) writable=$([ -w /dev/kvm ] && echo yes || echo no)"
          echo "cpu-virt-flag-count=$(grep -Ec 'vmx|svm' /proc/cpuinfo)"
          echo "runner-user=$(id -un) groups=$(id -Gn)"
          getent group kvm || echo "(no kvm group)"
          # Standard hosted-runner fix used by Android-emulator workflows:
          sudo modprobe kvm 2>/dev/null
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules 2>/dev/null
            sudo udevadm trigger --name-match=kvm 2>/dev/null
            sudo chmod 0666 /dev/kvm 2>/dev/null
            echo "after-fix: readable=$([ -r /dev/kvm ] && echo yes || echo no) writable=$([ -w /dev/kvm ] && echo yes || echo no)"
          fi
          exit 0

  # Real boot-to-userspace integration test. GitHub-hosted ubuntu-latest DOES
  # expose /dev/kvm with nested virtualization (the kvm-preflight diagnostic
  # confirms device-exists=yes, cpu-virt flags present); it only needs the runner
  # user granted access. We enable that, fetch a test kernel + minimal rootfs, and
  # run the #[ignore]d mm-vmm KVM boot test directly on GitHub's infrastructure —
  # no self-hosted runner required.
  kvm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -ld /dev/kvm
      - name: Install fixture build tools (musl linker + mke2fs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools e2fsprogs
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Run KVM boot integration test
        # Scope to the boot test file: this job runs as the unprivileged runner
        # user. The net test (tests/net_kvm.rs) needs root to create a bridge/TAP
        # and runs in the dedicated `net-integration` job instead.
        run: cargo test -p mm-vmm --features kvm-integration --test boot_kvm -- --ignored --nocapture

  # Real snapshot/restore integration test (FR-14). Boots a sandbox guest in-process,
  # snapshots it, restores into a fresh Machine, and re-snapshots — proving the
  # vCPU/clock/device capture+restore, RAM dump/load, and restore-activate seam round
  # trip. Runs as the unprivileged runner user (no jail/TAP), like the boot test.
  snapshot-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install fixture build tools (musl linker + mke2fs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools e2fsprogs
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Run KVM snapshot/restore integration test
        run: cargo test -p mm-vmm --features kvm-integration --test snapshot_kvm -- --ignored --nocapture

  # Real virtio-net integration test (FR-10/11). Boots a microVM with a net
  # device on a host bridge and asserts a guest-originated UDP datagram reaches a
  # host socket — proving virtio-net TX, the kernel's static `ip=` config, and
  # MMIO net-transport activation. Needs root (creates a bridge + TAP and opens
  # the TAP via TUNSETIFF), so the test binary runs under sudo.
  net-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install fixture build tools (musl linker + mke2fs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools e2fsprogs
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Build the net integration test
        run: cargo test -p mm-vmm --features kvm-integration --test net_kvm --no-run
      - name: Run the net integration test as root
        run: |
          sudo -E env "PATH=$PATH" \
            cargo test -p mm-vmm --features kvm-integration --test net_kvm \
            -- --ignored --nocapture

  # Real jailer integration test (FR-27). Drives `mm __vmm-worker` the way
  # `mm run` does and confirms a fully confined microVM (cgroup v2 + mount/pid/net
  # namespaces + chroot + no_new_privs + uid-drop + seccomp) boots to userspace
  # using only an inherited /dev/kvm fd. Needs root for the jailer's privileged
  # setup, so the test binary runs under sudo.
  jail-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install fixture build tools (musl linker + mke2fs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools e2fsprogs
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Enable cgroup v2 cpu+memory controllers
        run: |
          # The jailer creates a leaf cgroup and writes cpu.max/memory.max; those
          # files only exist if the controllers are delegated into the cgroup tree.
          # A privileged `mm` install would ensure this; here we do it explicitly
          # and report the before/after so a cgroup failure is self-diagnosing.
          set -x
          cat /sys/fs/cgroup/cgroup.controllers || true
          cat /sys/fs/cgroup/cgroup.subtree_control || true
          echo "+cpu +memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
          cat /sys/fs/cgroup/cgroup.subtree_control || true
      - name: Build the jail integration test
        run: cargo test -p mm --test jail_kvm --no-run
      - name: Run the jail integration test as root
        run: |
          sudo -E env "PATH=$PATH" \
            cargo test -p mm --test jail_kvm -- --ignored --nocapture

  # Full `mm run <oci>` end-to-end (FR-5/FR-6/FR-27): pull a real OCI image with
  # skopeo, unpack with umoci, inject mm-init, build the rootfs, wire bridge/TAP/
  # NAT, jail the worker, and boot the image as a microVM — asserting the guest
  # signals readiness. This is the product's headline path, exercised whole.
  mm-run-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install OCI tooling (skopeo + umoci) + fixture build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs skopeo
          # umoci is not packaged in apt; fetch the released static binary.
          sudo curl -fsSL -o /usr/local/bin/umoci \
            https://github.com/opencontainers/umoci/releases/download/v0.4.7/umoci.amd64
          sudo chmod 0755 /usr/local/bin/umoci
          umoci --version
          skopeo --version
      - name: Fetch test fixtures (kernel + musl mm-init)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Enable cgroup v2 cpu+memory controllers
        run: |
          set -x
          echo "+cpu +memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
      - name: Build the mm-run integration test
        run: cargo test -p mm --test run_oci_kvm --no-run
      - name: Run `mm run <oci>` end to end as root
        run: |
          sudo -E env "PATH=$PATH" \
            cargo test -p mm --test run_oci_kvm -- --ignored --nocapture

  # Full `mm ssh` end-to-end (FR-12): boot an OCI image with an injected static
  # dropbear, then run a command in the guest over a real SSH session via the `mm
  # ssh` CLI (managed-key auth, reachable over the bridge, zero per-image setup).
  ssh-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install OCI tooling + ssh client + fixture build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs skopeo openssh-client file
          sudo curl -fsSL -o /usr/local/bin/umoci \
            https://github.com/opencontainers/umoci/releases/download/v0.4.7/umoci.amd64
          sudo chmod 0755 /usr/local/bin/umoci
      - name: Build static dropbear (injected sshd)
        run: ./scripts/build-dropbear.sh
      - name: Fetch test fixtures (kernel + musl mm-init)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Enable cgroup v2 cpu+memory controllers
        run: echo "+cpu +memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
      - name: Build the ssh integration test
        run: cargo test -p mm --test ssh_kvm --no-run
      - name: Run `mm ssh` end to end as root
        run: |
          sudo -E env "PATH=$PATH" \
            cargo test -p mm --test ssh_kvm -- --ignored --nocapture

  # Full `mm exec` end-to-end (FR-13): boot an OCI image in sandbox mode (so the
  # in-guest exec agent listens on vsock 1025), then run commands in the guest via
  # the `mm exec` CLI through the host<->guest virtio-vsock bridge. Asserts a
  # large-output command (`seq 1 100000`) arrives intact — the load-bearing check
  # for the vsock muxer + credit flow control + jail-crossing UDS plumbing.
  exec-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - name: Enable /dev/kvm access for the runner user
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install OCI tooling (skopeo + umoci) + fixture build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools e2fsprogs skopeo
          sudo curl -fsSL -o /usr/local/bin/umoci \
            https://github.com/opencontainers/umoci/releases/download/v0.4.7/umoci.amd64
          sudo chmod 0755 /usr/local/bin/umoci
          umoci --version
          skopeo --version
      - name: Fetch test fixtures (kernel + musl mm-init)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Enable cgroup v2 cpu+memory controllers
        run: echo "+cpu +memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control || true
      - name: Build the mm-exec integration test
        run: cargo test -p mm --test exec_kvm --no-run
      - name: Run `mm exec` end to end as root
        run: |
          sudo -E env "PATH=$PATH" \
            cargo test -p mm --test exec_kvm -- --ignored --nocapture

  # Confirm the static dropbear sshd (injected into guest rootfs images for FR-12)
  # builds and is statically linked, so it runs in any guest userland.
  ssh-build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools file
      - name: Build static dropbear
        run: ./scripts/build-dropbear.sh /tmp/dropbear
      - name: Verify it is a static binary
        run: |
          set -euo pipefail
          file /tmp/dropbear
          file /tmp/dropbear | grep -q "statically linked"
          /tmp/dropbear -V 2>&1 | head -1 || true

  # Preflight for the upcoming net + jail runtime tests: confirms the hosted
  # runner allows passwordless sudo and host bridge/TAP creation (host<->guest
  # over a bridge is all the net test needs; NAT egress is not required). Pure
  # diagnostic — never fails the build.
  net-jail-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe sudo + bridge/TAP + namespaces
        run: |
          set +e
          sudo -n true && echo "passwordless-sudo=yes" || echo "passwordless-sudo=no"
          sudo ip link add mm-test-br type bridge && echo "bridge-create=ok" || echo "bridge-create=FAILED"
          sudo ip addr add 10.99.0.1/24 dev mm-test-br && echo "bridge-addr=ok" || echo "bridge-addr=FAILED"
          sudo ip link set mm-test-br up && echo "bridge-up=ok" || echo "bridge-up=FAILED"
          sudo ip tuntap add mm-test-tap mode tap && echo "tap-create=ok" || echo "tap-create=FAILED"
          sudo ip link set mm-test-tap master mm-test-br && echo "tap-attach=ok" || echo "tap-attach=FAILED"
          sudo ip link set mm-test-tap up && echo "tap-up=ok" || echo "tap-up=FAILED"
          # Unprivileged user namespaces (the jailer uses CLONE_NEWUSER):
          echo "userns-clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          echo "userns-max=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
          # cgroup v2:
          mount | grep -q 'cgroup2 on /sys/fs/cgroup ' && echo "cgroup2=yes" || echo "cgroup2=no"
          sudo ip link del mm-test-tap 2>/dev/null
          sudo ip link del mm-test-br 2>/dev/null
          exit 0
