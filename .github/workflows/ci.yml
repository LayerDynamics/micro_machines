name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # KVM capability preflight: reports whether this runner can host microVMs.
  # GitHub-hosted runners do not expose nested KVM, so the job records capability
  # without failing the build; a self-hosted/KVM-enabled runner exercises the
  # real host-virtualization path. M1 extends this job with mm-vmm integration
  # tests once that crate exists.
  kvm-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe KVM capability
        run: |
          set -euo pipefail
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=available (/dev/kvm is a readable, writable character device)"
            if grep -Eqm1 'vmx|svm' /proc/cpuinfo; then
              echo "cpu-virtualization=supported"
            else
              echo "cpu-virtualization=not-reported"
            fi
          else
            echo "kvm=unavailable (GitHub-hosted runners do not expose nested KVM)"
            echo "Host-virtualization integration runs on a self-hosted KVM runner."
          fi

  # Real boot-to-userspace integration test. Runs on a self-hosted runner that
  # exposes /dev/kvm; skipped automatically elsewhere because no such runner picks
  # the job up. Fetches a test kernel + minimal rootfs, then runs the #[ignore]d
  # mm-vmm KVM tests.
  kvm-integration:
    runs-on: [self-hosted, linux, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: Require /dev/kvm
        run: test -e /dev/kvm
      - name: Fetch test fixtures (kernel + rootfs)
        run: ./scripts/fetch-test-fixtures.sh
      - name: Run KVM boot integration test
        run: cargo test -p mm-vmm --features kvm-integration -- --ignored
